name: External desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build a native installer or transfer verified beta4 artifacts to a draft
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos
          - both
          - release-assets
      product_base_sha:
        description: Optional full product commit to verify before the macOS build
        required: false
        default: ''
        type: string
      release_id:
        description: Existing beta4 draft ID; used only by release-assets
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: windows-external-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'both' || inputs.platform == '' }}
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      JIUWENSWARM_BUILD_PROFILE: external
      UV_PYTHON: '3.13'
      PYTHONUTF8: '1'
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Record build source
        run: |
          "JIUWENSWARM_DATA_DIR=$env:RUNNER_TEMP\swarm-build-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force ci-evidence | Out-Null
          @{
            source_sha = $env:GITHUB_SHA
            profile = 'external'
            runner = $env:RUNNER_OS
            architecture = $env:RUNNER_ARCH
            uv_lock_sha256 = (Get-FileHash uv.lock -Algorithm SHA256).Hash
            signing = 'unsigned test installer'
          } | ConvertTo-Json | Set-Content ci-evidence/source.json
          git status --short
          uv --version
          node --version
      - name: Build full Windows installer
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path ci-evidence/build.log
          try {
            & .\scripts\build-electron-exe.ps1 -BuildProfile external -NoSign
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed: $LASTEXITCODE" }
            git diff --exit-code -- uv.lock
            if ($LASTEXITCODE -ne 0) { throw 'Locked dependencies changed during build' }
            $Installers = @(Get-ChildItem dist -File -Filter *.exe)
            if ($Installers.Count -eq 0) { throw 'No installer executable was produced' }
            $Installers | ForEach-Object {
              $Hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($Hash.Hash)  $($_.Name)"
            } | Set-Content ci-evidence/SHA256SUMS
          } finally {
            Stop-Transcript
          }
      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-external-installer-${{ github.sha }}
          path: |
            dist/*.exe
            ci-evidence/SHA256SUMS
            ci-evidence/source.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-external-build-log-${{ github.run_id }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14

  release-assets:
    if: ${{ inputs.platform == 'release-assets' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: leemine/code-platform
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - name: Verify and transfer beta4 Windows and macOS installers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          repo = os.environ['GH_REPO']
          release_id = os.environ['RELEASE_ID']
          if not release_id.isdigit():
              raise ValueError('An existing numeric draft release ID is required')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], text=True))
          release = api(f'releases/{release_id}')
          assert release['tag_name'] == 'v0.2.5.beta4' and release['draft']
          assert release['prerelease']
          assert release['target_commitish'] == 'cf07852397f3b7547ba6b52a54628b89e4aacd4e'
          packages = [
              (41467786074, 'cf07852397f3b7547ba6b52a54628b89e4aacd4e',
               'windows-external-installer-cf07852397f3b7547ba6b52a54628b89e4aacd4e',
               'WorkSwarm-0.2.5.beta4-windows.exe',
               '33481c6204ae1463260e8b69827429cafb6aa3c6369c4c8d7538f8eadbae3128'),
              (41468736696, '63f04d37507aade08c70b5d433efd4a447812368',
               'macos-arm64-external-installer-63f04d37507aade08c70b5d433efd4a447812368',
               'WorkSwarm-0.2.5.beta4-macos.dmg',
               '48f341dd8730aee248d7dc90b64b39690ed7c93d40399014e177e9c114865169'),
          ]
          for run_id, sha, artifact, name, expected in packages:
              run = api(f'actions/runs/{run_id}')
              assert run['conclusion'] == 'success' and run['head_sha'] == sha
              root = Path('release-assets') / str(run_id)
              subprocess.run(['gh', 'run', 'download', str(run_id), '--repo', repo,
                  '--name', artifact, '--dir', str(root)], check=True)
              sources = list(root.rglob('source.json'))
              assert len(sources) == 1
              source = json.loads(sources[0].read_text(encoding='utf-8-sig'))
              assert source['source_sha'] == sha and source['profile'] == 'external'
              files = list(root.rglob(name))
              assert len(files) == 1
              file = files[0]
              digest = hashlib.sha256()
              with file.open('rb') as stream:
                  for block in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                      digest.update(block)
              assert digest.hexdigest() == expected
              existing = [a for a in api(f'releases/{release_id}')['assets'] if a['name'] == name]
              if existing:
                  assert len(existing) == 1 and existing[0]['state'] == 'uploaded'
                  assert existing[0]['digest'] == 'sha256:' + expected
              else:
                  subprocess.run(['gh', 'release', 'upload', 'v0.2.5.beta4',
                      '--repo', repo, str(file)], check=True)
              uploaded = [a for a in api(f'releases/{release_id}')['assets'] if a['name'] == name]
              assert len(uploaded) == 1 and uploaded[0]['size'] == file.stat().st_size
              assert uploaded[0]['state'] == 'uploaded' and uploaded[0]['digest'] == 'sha256:' + expected
              print(json.dumps({'asset': name, 'bytes': file.stat().st_size,
                  'sha256': expected, 'source_run': run_id}))
          print('Verified artifacts transferred to draft; publication remains a separate step.')
          PY

  macos:
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'both' }}
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      JIUWENSWARM_BUILD_PROFILE: external
      UV_PYTHON: '3.13'
      NOSIGN: '1'
      NOTARIZE: '0'
      PRODUCT_BASE_SHA: ${{ inputs.product_base_sha }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Set up Bun for the bundled TUI
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.5'
      - name: Record build source and native architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          echo "JIUWENSWARM_DATA_DIR=$RUNNER_TEMP/swarm-build-data" >> "$GITHUB_ENV"
          mkdir -p ci-evidence
          python3 - <<'PY'
          import hashlib, json, os, platform, re, subprocess
          from pathlib import Path
          base = os.environ.get('PRODUCT_BASE_SHA') or os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', base):
              raise ValueError('product_base_sha must be a full commit SHA')
          subprocess.run(['git', 'diff', '--exit-code', base, '--', 'jiuwenswarm',
              'gateway', 'packages', 'scripts', 'pyproject.toml', 'uv.lock'], check=True)
          Path('ci-evidence/source.json').write_text(json.dumps({
              'source_sha': os.environ['GITHUB_SHA'], 'product_base_sha': base,
              'profile': 'external', 'runner': os.environ['RUNNER_OS'],
              'architecture': platform.machine(),
              'uv_lock_sha256': hashlib.sha256(Path('uv.lock').read_bytes()).hexdigest(),
              'signing': 'no Developer ID signing or notarization; test installer',
          }, indent=2) + '\n')
          PY
          uv --version
          node --version
          bun --version
      - name: Build full macOS arm64 installer
        run: |
          set -euo pipefail
          bash scripts/build-electron-exe.sh 2>&1 | tee ci-evidence/build.log
          git diff --exit-code -- uv.lock
          shopt -s nullglob
          installers=(dist/*.dmg)
          test "${#installers[@]}" -gt 0
          shasum -a 256 "${installers[@]}" > ci-evidence/SHA256SUMS
      - name: Upload macOS installer
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm64-external-installer-${{ github.sha }}
          path: |
            dist/*.dmg
            ci-evidence/SHA256SUMS
            ci-evidence/source.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload macOS build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-external-build-log-${{ github.run_id }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14
